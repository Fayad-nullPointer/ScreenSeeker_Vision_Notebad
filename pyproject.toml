[project]
name = "automatic-cursor-notebad"
version = "0.1.0"
description = "Vision-Based Desktop Automation with Dynamic Icon Grounding using ScreenSeekeR framework"
readme = "design_doc.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyautogui>=0.9.54",
    "mss>=9.0.1",
    "pillow>=10.0.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "openai>=1.30.0",
    "google-genai>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
